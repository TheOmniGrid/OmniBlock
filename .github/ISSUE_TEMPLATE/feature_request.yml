name: Feature request
description: Suggest something OmniBlock should do that it doesn't yet.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Requests that start from a real problem are much easier to act on than
        requests that start from a specific implementation. Tell us what's not
        working for you first — there may already be a way to solve it, or a
        better one than what you had in mind.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you running into?
      description: What are you trying to do, and where does OmniBlock currently fall short of it?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Your proposed solution — as concrete or as loose as you like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've already tried?
      description: A protection level, a custom list, a My Filters rule, another extension — anything that gets partway there today.

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Links, screenshots, or examples from other tools if they help explain what you mean.
